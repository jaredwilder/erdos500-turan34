name: Verification Replay

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovered source bytes
        run: python -X utf8 verification/verify_source_packet.py
      - name: Replay dependency-free finite packet
        run: python -X utf8 verification/replay_packet.py --receipt /tmp/erdos500-fresh-replay.json
