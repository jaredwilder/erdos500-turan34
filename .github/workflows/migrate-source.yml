name: One-shot source migration

on:
  push:
    paths:
      - '.github/workflows/migrate-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact #500 sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jaredwilder/unpublished-math-papers.git /tmp/papers
          git clone --depth 1 https://github.com/jaredwilder/erdos-theorems.git /tmp/theorems
          git clone --depth 1 https://github.com/jaredwilder/combinatorial-records.git /tmp/records
          mkdir -p program formal-mirrors records
          cp -R /tmp/papers/erdos500-turan34/. program/
          shopt -s nullglob
          for d in /tmp/theorems/erdos500-*; do cp -R "$d" formal-mirrors/; done
          cp -R /tmp/records/erdos500/. records/
          rm .github/workflows/migrate-source.yml
          git config user.name "Jared Wilder release migration"
          git config user.email "jared@jaredwilder.com"
          git add -A
          git commit -m "Migrate exact Erdős 500 Turán sources"
          git push
